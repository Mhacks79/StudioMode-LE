; Studio Mode settings
; Keys are DirectInput scan codes (the same numbers SkyUI's MCM and SKSE use):
; https://www.creationkit.com/index.php?title=Input_Script#DXScanCodes

[Controls]
; Home
iToggleKey = 199
; Print Screen
iTakePhotoKey = 183
; T - hides the Studio Mode window and the HUD
iToggleMenusKey = 20
; F
iFreezeTimeKey = 33
; R - resets the current tab
iResetKey = 19
; E / Q
iNextTabKey = 18
iPreviousTabKey = 16
; Gamepad buttons use SKSE key codes:
; 266 D-pad up, 267 down, 268 left, 269 right, 270 Start, 271 Back, 272 LS, 273 RS,
; 274 LB, 275 RB, 276 A, 277 B, 278 X, 279 Y, 280 LT, 281 RT. 0 = none.
; Open: press iToggleGamePad while holding iToggleGamePadModifier (RB while holding LB).
iToggleGamePad = 275
iToggleGamePadModifier = 274
iExitGamePad = 270
iTakePhotoGamePad = 271
iToggleMenusGamePad = 278
iResetGamePad = 279
iNextTabGamePad = 281
iPreviousTabGamePad = 280
; In the window: D-pad moves, A changes a value or opens a list, B goes back. Sticks move and turn the camera.

; Hold to turn the camera with the mouse. Right mouse always does this; 0 = no extra key.
; Left Shift is "Run" in the free camera, so it is not the default here.
iPanCameraKey = 0

[Settings]
; Applied when Studio Mode opens. -1 keeps the game's fFreeCameraTranslationSpeed.
fFreeCameraTranslationSpeed = -1
bFreezeTimeOnStart = 0
; Mouse cursor speed in the Studio Mode window
fCursorSpeed = 1.0
; Interface size, 1.0 = sized for the screen height
fUIScale = 1.0

[Screenshots]
; Hide the HUD for the frame the photo is taken
bAutoHideMenus = 1
; Empty: Documents\My Games\Skyrim\StudioMode
sPhotoFolder =

[Fonts]
; Read from Data\Interface\ImGuiIcons\Fonts (the "ImGui Icons" mod). Sizes are for 1080p and scale
; with the screen height. Without that mod, Segoe UI and text key names are used instead.
sFont = Jost-Regular.ttf
iFontSize = 27
iIconSize = 20
